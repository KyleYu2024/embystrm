name: Build Plugin

on:
  push:
    branches:
      - tab-ui
      - simple-ui
      - lite
  pull_request:
    branches:
      - tab-ui
      - simple-ui
      - lite

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.x'

      - name: Restore dependencies
        run: dotnet restore StrmLiteAssistant\StrmLiteAssistant.csproj

      - name: Build the project
        run: dotnet build StrmLiteAssistant\StrmLiteAssistant.csproj --no-restore --configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmLiteAssistant
          path: StrmLiteAssistant\bin\Release\netstandard2.1\StrmLiteAssistant.dll
